name: dont_work_for_free
description: "Track your 8.5-hour shift. Leave on time. Never work for free."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Core local storage
  shared_preferences: ^2.3.5

  # Local notifications & scheduling
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0

  # State management
  provider: ^6.1.2

  # Date/time formatting
  intl: ^0.19.0

  # Shift history database
  sqflite: ^2.4.2
  path: ^1.9.0

  # Home screen widget
  home_widget: ^0.7.0

  # Share export
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  path_provider: ^2.1.5

  # Biometric lock
  local_auth: ^2.3.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/dont_work_for_work.png"
  min_sdk_android: 23
  adaptive_icon_background: "#080C18"
  adaptive_icon_foreground: "assets/images/dont_work_for_work.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
